trigger:
  branches:
    include:
      - main

pool:
  vmImage: 'ubuntu-latest'

steps:
  # 1. Set up Python environment
  - task: UsePythonVersion@0
    inputs:
      versionSpec: '3.11'
      addToPath: true
    displayName: '1. Setup Python 3.11 Environment'

  # 2. Install Dependencies
  - script: |
      python -m pip install --upgrade pip
      pip install -r requirements.txt
    displayName: '2. Install Required Python Packages'

  # 3. Run Unit Tests (pytest)
  - script: |
      pytest test_app.py --junitxml=test-results.xml
    displayName: '3. Run Unit Tests (pytest)'

  # 4. Run Bandit Static Application Security Testing (SAST)
  - script: |
      bandit -r app.py -f json -o bandit_results.json || true
    displayName: '4. Run Bandit Security Scanner'

  # 4b. Fail the build if Bandit found any HIGH severity issue.
  - script: |
      python - <<'EOF'
      import json, sys

      with open("bandit_results.json") as f:
          data = json.load(f)

      high_severity = [
          r for r in data.get("results", [])
          if r.get("issue_severity") == "HIGH"
      ]

      if high_severity:
          print(f"❌ {len(high_severity)} HIGH severity issue(s) found:")
          for issue in high_severity:
              print(f"  - {issue['test_id']} ({issue['filename']}:{issue['line_number']}): {issue['issue_text']}")
          sys.exit(1)
      else:
          print("✅ No HIGH severity Bandit findings.")
      EOF
    displayName: '4b. Enforce High-Severity Security Gate (Bandit)'

  # 5. Build the container image
  - script: |
      docker build -t devsecops-ai-platform:$(Build.BuildId) .
    displayName: '5. Build Docker Image'
    condition: always()

  # 6. Scan the image with Trivy
  - script: |
      curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sh -s -- -b /usr/local/bin
      trivy image --severity HIGH,CRITICAL --ignore-unfixed --format json --output trivy_results.json devsecops-ai-platform:$(Build.BuildId) || true
    displayName: '6. Run Trivy Container Scan'
    condition: always()

  # 6b. Fail the build if Trivy found any CRITICAL vulnerability.
  - script: |
      python - <<'EOF'
      import json, sys

      try:
          with open("trivy_results.json") as f:
              data = json.load(f)
      except FileNotFoundError:
          print("⚠️ trivy_results.json not found, skipping gate.")
          sys.exit(0)

      critical = []
      for result in data.get("Results", []):
          for vuln in result.get("Vulnerabilities", []) or []:
              if vuln.get("Severity") == "CRITICAL":
                  critical.append(vuln)

      if critical:
          print(f"❌ {len(critical)} CRITICAL vulnerability(ies) found in image:")
          for v in critical:
              print(f"  - {v.get('VulnerabilityID')} in {v.get('PkgName')}: {v.get('Title', 'no title')}")
          sys.exit(1)
      else:
          print("✅ No CRITICAL Trivy findings.")
      EOF
    displayName: '6c. Enforce Critical-Severity Security Gate (Trivy)'

  # 7. Run Gemini AI Code Review Script
  - script: |
      python review_code.py
    env:
      GEMINI_API_KEY: $(GEMINI_API_KEY)
    displayName: '7. Execute Gemini AI Code Review'
    condition: always()

  # 8. Build the HTML Audit Report Dashboard
  - script: |
      python generate_report.py
    displayName: '8. Generate HTML Audit Dashboard'
    condition: always()

  # 9. Publish Test Results to Azure DevOps Summary Screen
  - task: PublishTestResults@2
    condition: always()
    inputs:
      testResultsFormat: 'JUnit'
      testResultsFiles: 'test-results.xml'
      failTaskOnFailedTests: true
    displayName: '9. Publish Unit Test Results'

  # 10. Publish the Generated HTML Web App as a Pipeline Artifact
  - task: PublishPipelineArtifact@1
    condition: always()
    inputs:
      targetPath: 'index.html'
      artifact: 'DevSecOps_AI_Report'
      publishLocation: 'pipeline'
    displayName: '10. Publish HTML Report Artifact'
